<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 65th Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FDFBF7;
    --gold: #D4AF37;
    --navy: #1A2B4C;
    --white: #FFFFFF;
    --mist: #F3EEE2;
    --shadow: 0 18px 48px rgba(26, 43, 76, .14);
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ivory);
    color: var(--navy);
    font: 400 clamp(20px, 2.2vw, 24px)/1.6 var(--sans);
    overflow: hidden;
  }
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: clamp(16px, 4vw, 48px);
    background: var(--ivory);
    opacity: 0; visibility: hidden;
    transition: opacity 1.4s ease, visibility 0s 1.4s;
  }
  .stage.on { opacity: 1; visibility: visible; transition: opacity 1.4s ease; }

  .card {
    width: min(920px, 100%);
    text-align: center;
  }
  h1 {
    font: 700 clamp(40px, 7vw, 76px)/1.15 var(--serif);
    color: var(--navy);
  }
  .rule {
    width: 96px; height: 3px; background: var(--gold);
    margin: 28px auto; border-radius: 2px;
    transform-origin: center;
  }
  .sub { font-size: clamp(22px, 2.8vw, 30px); }
  .sub strong { font-family: var(--serif); font-weight: 500; }
  .body { max-width: 34ch; margin: 0 auto; font-size: clamp(22px, 2.6vw, 28px); }

  /* Intro and outro: soft focus-in reveal, gold line draws from the center */
  .stage.on .card > * { animation: reveal 1.8s var(--ease) both; }
  .stage.on .card > :nth-child(1) { animation-delay: .3s; }
  .stage.on .card > :nth-child(2) { animation: draw 1.2s var(--ease) .9s both; }
  .stage.on .card > :nth-child(3) { animation-delay: 1.3s; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(12px); filter: blur(8px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes draw {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  /* Outro: more breathing room */
  #outro .card { width: min(1240px, 100%); padding: clamp(24px, 5vh, 64px) clamp(8px, 3vw, 40px); }
  #outro h1 {
    font-size: clamp(26px, 3.7vw, 48px);
    line-height: 1.3;
    letter-spacing: .01em;
    margin: 0 auto;
    text-wrap: balance;
  }
  #outro .rule { margin: clamp(28px, 5vh, 48px) auto; }
  #outro .body {
    max-width: 68ch;
    font-size: clamp(18px, 1.9vw, 24px);
    line-height: 1.8;
    text-wrap: balance;
  }

  /* Player: full video always visible, scaled to fit any screen */
  #player { padding: 0; background: #000; }
  .player { position: absolute; inset: 0; }
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    transition: opacity .6s ease;
  }
  video.fade { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .stage.on .card > *,
    .stage.on .card > :nth-child(2) { animation: none; }
    .stage, video { transition-duration: .01s; }
  }
</style>
</head>
<body>

<section class="stage" id="intro">
  <div class="card">
    <h1>Happy 65th Birthday!</h1>
    <div class="rule"></div>
    <p class="sub">With all our love, <strong>The Alvarez Family</strong></p>
  </div>
</section>

<section class="stage" id="player">
  <div class="player">
    <video id="video" playsinline preload="auto"></video>
  </div>
</section>

<section class="stage" id="outro">
  <div class="card">
    <h1>Wishing You a Blessed &amp; Joyful 65th Year!</h1>
    <div class="rule"></div>
    <p class="body">Thank you for every kindness, every meal, and every lesson. May this year bring you good health, laughter, and all the love you have given us. We are so proud to be your family.</p>
  </div>
</section>

<script>
  // Curated order: elders first, then relatives, a long heartfelt message in
  // the middle, and the grandchildren as the grand finale.
  const videoList = [
    'video17.mp4', // two elder ladies, warm opening wishes
    'video16.mp4', // elder couple
    'video14.mp4', // uncle, cheerful greeting
    'video12.mp4', // short, sincere message
    'video19.mp4', // longest, heartfelt message
    'video15.mp4', // couple on the sofa
    'video18.mp4', // couple in the car
    'video13.mp4', // playground, waving with the dog
    'video11.mp4'  // the kids, grand finale
  ];

  const INTRO_MS = 7000;
  const $ = id => document.getElementById(id);
  const show = id => document.querySelectorAll('.stage').forEach(s => s.classList.toggle('on', s.id === id));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const video = $('video');
  let index = 0;

  // Prefer sound; fall back to muted autoplay if the browser blocks it.
  async function start() {
    video.muted = false;
    try { await video.play(); }
    catch { video.muted = true; try { await video.play(); } catch { /* skip handled by error event */ } }
  }

  async function playCurrent() {
    video.classList.add('fade');
    await wait(400);
    video.src = videoList[index];
    video.load();
    video.classList.remove('fade');
    await start();
  }

  async function next() {
    index++;
    if (index < videoList.length) return playCurrent();
    show('outro');
  }

  video.addEventListener('ended', next);
  video.addEventListener('error', next); // never stall on a missing file

  // If autoplay forced muted playback, any touch or key press restores sound.
  ['pointerdown', 'keydown'].forEach(ev =>
    window.addEventListener(ev, () => { video.muted = false; }, { once: true })
  );

  (async function run() {
    show('intro');
    await wait(INTRO_MS);
    show('player');
    await wait(1400);
    playCurrent();
  })();
</script>
</body>
</html>
